name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[test]
      - run: pytest -q
  oldest-dependencies:
    # the lowest versions pyproject.toml allows (PyPI has no mpmath 1.2.0,
    # so 1.2.1 is the lowest installable mpmath >= 1.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "numpy==1.22.0" "scipy==1.8.0" "mpmath==1.2.1" "pytest>=7"
      - run: pip install --no-deps -e .
      - run: pytest -q
